{% extends "layout.html" %}
{% block body %}

<div class="row pt-4 pb-5">
  <div class="col-md-8 mx-auto">
    <div class="card card-body bg-dark text-light border-secondary shadow-lg">
      <form action="{{url_for('comando_iot')}}" method="POST">
        <h3 class="mb-4 border-bottom border-secondary pb-2">Panel de Control IoT</h3>
        
        <div class="form-group mb-4">
          <label class="form-label" for="nodo_mac"><strong>Seleccionar Dispositivo Destinatario</strong></label>
          <select class="form-select bg-dark text-light border-secondary" id="nodo_mac" name="nodo_mac" required>
            <option value="" disabled selected>Seleccioná una placa Raspberry Pi Pico...</option>
            <option value="28:cd:c1:05:57:12">Nodo Principal (28:cd:c1:05:57:12)</option>
            </select>
        </div>

        <div class="row align-items-end bg-secondary bg-opacity-10 p-3 rounded border border-secondary">
          
          <div class="col-md-5 mb-3 mb-md-0">
            <label class="form-label text-muted d-block small">Test de Conexión y LED</label>
            <button type="submit" name="accion" value="destello" class="btn btn-warning w-100 fw-bold">
              ⚡ Enviar Destello
            </button>
          </div>

          <div class="col-md-7">
            <label for="setpoint_val" class="form-label text-muted small">Configurar Temperatura (°C)</label>
            <div class="input-group">
              <input type="number" step="0.1" class="form-control bg-dark text-light border-secondary" id="setpoint_val" name="setpoint_val" placeholder="Ej: 24.5">
              <button type="submit" name="accion" value="setpoint" class="btn btn-info fw-bold">
                Fijar Setpoint
              </button>
            </div>
          </div>
          
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
